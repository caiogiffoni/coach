[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120.2",
    "bcrypt>=5.0.0",
    "curl-cffi>=0.15.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.13",
    "garminconnect>=0.3.8",
    "openai>=2.50.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
